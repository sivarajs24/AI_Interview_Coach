{% extends "base.html" %}

{% block content %}
<section class="section auth-section">
    <div class="glass auth-card">
        <h1>Create Account</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Register</button>
        </form>
        <p class="auth-link">
            Already have an account? <a href="{% url 'login' %}">Login</a>
        </p>
    </div>
</section>
{% endblock %}
