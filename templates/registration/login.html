{% extends "base.html" %}

{% block content %}
<section class="auth-page">
    <div class="glass form-card">
        <p class="eyebrow">// Authentication</p>
        <h1 class="form-title">Welcome Back</h1>
        <p class="form-subtitle">Sign in to your AI Interview Coach account.</p>

        {% if error %}
        <div style="padding:0.85rem 1.1rem;background:var(--danger-bg);border:1px solid rgba(255,68,102,0.3);border-radius:var(--radius-md);margin-bottom:1.5rem;font-family:'JetBrains Mono',monospace;font-size:0.82rem;color:var(--danger);">
            ⚠ {{ error }}
        </div>
        {% endif %}

        <form method="post">
            <p>
                <label for="id_username">Username:</label>
                <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username">
            </p>
            <p>
                <label for="id_password">Password:</label>
                <input type="password" name="password" autocomplete="current-password" required id="id_password">
            </p>

            <button type="submit" class="btn" style="width:100%;" id="loginBtn">Sign In →</button>
        </form>

        <div class="form-footer-link">
            Don't have an account? <a href="/accounts/register/">Create one</a>
        </div>
    </div>
</section>
{% endblock %}
